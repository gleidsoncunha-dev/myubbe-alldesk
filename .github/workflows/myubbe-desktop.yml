name: MyUbbe AllDesk desktop release

on:
  push:
    tags:
      - 'myubbe-v*'

jobs:
  validate-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_TAG'] == f'myubbe-v{version}', 'Tag and Cargo version differ'
          workflow = Path('.github/workflows/flutter-build.yml').read_text()
          assert re.search(r'^  VERSION: "([^"]+)"', workflow, re.M)[1] == version
          assert re.search(rf'^version: {re.escape(version)}\+\d+$', Path('flutter/pubspec.yaml').read_text(), re.M)
          print(f'Version validated: {version}')
          PY

  release-desktop:
    needs: [validate-version]
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
      desktop-only: true
      draft-release: true
      publish-update-metadata: false

  publish-release:
    needs: [release-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Publish complete desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, subprocess, tempfile, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          tag = os.environ['RELEASE_TAG']
          assert tag == f'myubbe-v{version}'
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'assets,isDraft'], text=True))
          expected = {f'myubbe-alldesk-{version}-{arch}.{ext}' for arch in ('x86_64', 'aarch64') for ext in ('exe', 'msi', 'dmg')}
          expected.add('alldesk.sbom.json')
          missing = expected - {asset['name'] for asset in release['assets']}
          assert not missing, f'Missing release assets: {sorted(missing)}'
          assert release['isDraft'], 'Expected a draft release'
          config_path = Path('myubbe-alldesk-server-config.txt')
          config_path.write_bytes(subprocess.check_output(['python', 'scripts/export_server_config.py']))
          subprocess.run(['gh', 'release', 'upload', tag, str(config_path), 'deploy/client-config.json'], check=True)
          notes = f'''MyUbbe AllDesk {version}.

          - Marca AllDesk em títulos, menus, mensagens e rodapé; links de suporte e downloads do próprio projeto.
          - Clientes Windows x64/ARM64 e Mac Intel/Apple Silicon.
          - EXE portátil e MSI para Windows; DMG para Mac.
          - Servidor MyUbbe próprio e chave pública definidos por padrão; configurações manuais existentes são preservadas.
          - Para clientes anteriores: importar myubbe-alldesk-server-config.txt em Configurações → Rede.
          - Windows sem assinatura comercial; Mac com assinatura ad hoc, sem notarização.
          - Compilação e metadados conferidos em CI. A versão anterior teve sessão Mac → Windows confirmada pelo titular; a inspeção visual desta versão nos equipamentos permanece pendente.

          Código correspondente e licença AGPL-3.0: https://github.com/{os.environ['GH_REPO']}/tree/{tag}
          '''
          with tempfile.NamedTemporaryFile(mode='w', encoding='utf-8', suffix='.md', delete=False) as output:
              output.write(notes)
              notes_path = output.name
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false', '--prerelease', '--title', f'MyUbbe AllDesk {version}', '--notes-file', notes_path], check=True)
          print(f'Published complete release: {tag}')
          PY
