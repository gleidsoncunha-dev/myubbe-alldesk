name: MyUbbe server configuration

on:
  push:
    branches: [master]
    paths: ['deploy/**', 'scripts/*server*', 'scripts/*configure_client*', '.github/workflows/myubbe-server.yml']
  pull_request:
    paths: ['deploy/**', 'scripts/*server*', 'scripts/*configure_client*', '.github/workflows/myubbe-server.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate deployment and safe client configuration
        run: |
          bash -n deploy/vps/publish.sh
          docker compose -f deploy/vps/compose.yaml config --quiet
          python -m unittest discover -s scripts -p test_configure_client.py -v
          python scripts/export_server_config.py
